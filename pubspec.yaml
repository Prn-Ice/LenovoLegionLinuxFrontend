name: legion_frontend
description: "Flutter desktop frontend for LenovoLegionLinux - laptop control on Linux."
# This desktop app is not published to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  # Keep source syntax within the Hive generator's analyzer support.
  # The Flutter floor below supplies Dart 3.13; see docs/dependencies.md.
  sdk: ^3.11.0
  flutter: '>=3.47.9'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0
  riverbloc: ^3.0.0
  # Version 3 changes event equality; see docs/dependencies.md.
  equatable: ^2.1.0
  flutter_riverpod: ^3.4.3
  yaru: ^11.0.0
  handy_window: ^0.4.2
  file_picker: ^13.3.2
  hive_ce: ^2.22.0
  hive_ce_flutter: ^2.5.0
  fl_chart: ^1.3.0
  ffi: ^2.2.0
  dbus: ^0.8.0
  flutter_svg: ^2.3.2

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  bloc_test: ^10.0.0

  # Lint configuration lives in analysis_options.yaml.
  flutter_lints: ^6.0.0
  hive_ce_generator: ^1.11.2
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  assets:
    - assets/branding/
    - assets/gpu_vendors/
    - pubspec.yaml
