name: Prepare package build inputs
description: Cache downloads and verify them against the pinned build inputs.
inputs:
  appimage-runtime:
    description: Include the AppImage runtime and its source archives.
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/cache@v5
      if: runner.environment == 'github-hosted'
      with:
        path: ${{ runner.temp }}/flutter.tar.xz
        key: flutter-archive-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/appimage/build-inputs.json') }}
    - name: Verify or download the pinned SDK
      shell: bash
      env:
        RUNNER_KIND: ${{ runner.environment }}
      run: |
        archive="$RUNNER_TEMP/flutter.tar.xz"
        if [[ $RUNNER_KIND == self-hosted ]]; then
          archive="$HOME/.cache/legion-ci/flutter-$(jq -er '.flutter.sha256' packaging/appimage/build-inputs.json).tar.xz"
        fi
        bash tool/cache_flutter_archive.sh "$archive"
        echo "PACKAGE_FLUTTER_ARCHIVE=$archive" >> "$GITHUB_ENV"
    - uses: actions/cache@v5
      if: inputs.appimage-runtime == 'true' && runner.environment == 'github-hosted'
      with:
        path: build/appimage-inputs
        key: appimage-inputs-${{ hashFiles('packaging/appimage/build-inputs.json') }}
    - name: Verify or download runtime inputs
      if: inputs.appimage-runtime == 'true'
      shell: bash
      env:
        RUNNER_KIND: ${{ runner.environment }}
      run: |
        inputs=build/appimage-inputs
        if [[ $RUNNER_KIND == self-hosted ]]; then
          inputs="$HOME/.cache/legion-ci/appimage-${{ hashFiles('packaging/appimage/build-inputs.json') }}"
        fi
        bash tool/fetch_appimage_runtime.sh "$inputs"
        echo "PACKAGE_RUNTIME_INPUTS=$inputs" >> "$GITHUB_ENV"
