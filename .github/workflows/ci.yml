name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Flutter Test & Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Hive adapters
        run: dart run build_runner build

      - name: Check generated sources
        run: git diff --exit-code -- lib

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter=compact

  native:
    name: Native services and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libglib2.0-dev libpolkit-gobject-1-dev dbus

      - name: Configure
        run: cmake -S telemetry -B build/native -G Ninja -DBUILD_LEGION_CONTROL_SERVICE=ON -DBUILD_TESTING=ON

      - name: Build services and tests
        run: >-
          cmake --build build/native --parallel 2 --target
          legion_telemetry_service legion_control_service
          package_power_sampler_test control_commands_test graphics_boot_service_test

      - name: Run native tests
        run: ctest --test-dir build/native --output-on-failure --no-tests=error
