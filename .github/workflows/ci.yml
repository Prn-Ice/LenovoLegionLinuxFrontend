name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    outputs:
      appimage_run:
        description: Run containing the checked AppImage and acceptance evidence.
        value: ${{ jobs.changes.outputs.appimage_run || github.run_id }}
      debian_run:
        description: Run containing the checked Debian package and acceptance evidence.
        value: ${{ jobs.changes.outputs.debian_run || github.run_id }}

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Select build and VM checks
    runs-on: ubuntu-latest
    outputs:
      integration: ${{ steps.changes.outputs.integration }}
      lifecycle: ${{ steps.changes.outputs.lifecycle }}
      nix: ${{ steps.changes.outputs.nix }}
      appimage: ${{ steps.changes.outputs.appimage }}
      debian: ${{ steps.changes.outputs.debian }}
      test_run: ${{ steps.reuse.outputs.test_run }}
      native_run: ${{ steps.reuse.outputs.native_run }}
      lifecycle_run: ${{ steps.reuse.outputs.lifecycle_run }}
      integration_run: ${{ steps.reuse.outputs.integration_run }}
      nix_run: ${{ steps.reuse.outputs.nix_run }}
      appimage_run: ${{ steps.reuse.outputs.appimage_run }}
      appimage_build_run: ${{ steps.reuse.outputs.appimage_build_run }}
      debian_run: ${{ steps.reuse.outputs.debian_run }}
      debian_build_run: ${{ steps.reuse.outputs.debian_build_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check PR paths or select every check for main and tags
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            bash tool/ci_build_changes.sh --base "$PR_BASE"
          else
            bash tool/ci_build_changes.sh
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
          pub-cache: false
      - name: Find successful exact-commit checks
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: dart tool/ci_reuse.dart

  test:
    name: Flutter Test & Analyze
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.test_run == ''

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake g++ make dpkg squashfs-tools
          flutter pub get --enforce-lockfile

      - name: Generate Hive adapters
        run: dart run build_runner build

      - name: Check generated sources
        run: git diff --exit-code -- lib

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter=compact

      - name: Test VM readiness and evidence handling
        run: |
          bash control/test/acceptance_support_test.sh
          bash test/tool/appimage_nixos_wrapper_test.sh
          bash test/tool/portable_distro_evidence_test.sh
          bash test/tool/portable_distro_readiness_test.sh

      - uses: ./.github/actions/ci-success
        with:
          check: test

  native:
    name: Native services and tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.native_run == ''

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libglib2.0-dev libpolkit-gobject-1-dev dbus jq

      - name: Test graphics guards without hardware
        run: |
          bash tool/test_graphics_boot.sh
          bash tool/test_setup_next_boot_graphics.sh
          bash tool/test_check_graphics_tty.sh
          bash tool/test_auto_battery_tty_json.sh

      - name: Set up Flutter for the portable control probe
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Resolve probe dependencies
        run: flutter pub get --enforce-lockfile

      - name: Configure
        run: >-
          cmake -S telemetry -B build/native -G Ninja
          -DBUILD_LEGION_CONTROL_SERVICE=ON -DBUILD_TESTING=ON
          -DBUILD_PORTABLE_CONTROL_PROTOTYPE=ON -DBUILD_PORTABLE_CONTROL_HELPER=ON

      - name: Build services and tests
        run: >-
          cmake --build build/native --parallel 2 --target
          legion_telemetry_service legion_control_service
          package_power_sampler_test control_commands_test graphics_boot_service_test managed_command_test executable_snapshot_test portable_lifetime_test portable_peer_test trusted_executable_test portable_cli_test
          portable_control_probe legion_portable_control

      - name: Run native tests
        run: ctest --test-dir build/native --output-on-failure --no-tests=error

      - name: Probe portable control without hardware
        timeout-minutes: 2
        run: dart run tool/probe_portable_control.dart --helper build/native/portable_control_probe

      - uses: ./.github/actions/ci-success
        with:
          check: native

  control-lifecycle:
    name: Control lifecycle and portable startup VMs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.lifecycle == 'true' && needs.changes.outputs.lifecycle_run == ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
      - name: Verify containment and portable startup with real systemd
        run: >-
          nix build .#checks.x86_64-linux.control-lifecycle
          .#checks.x86_64-linux.portable-bootstrap --print-build-logs
      - uses: ./.github/actions/ci-success
        with:
          check: lifecycle

  appimage-build:
    name: AppImage build and source companion
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.appimage == 'true' && needs.changes.outputs.appimage_run == '' && needs.changes.outputs.appimage_build_run == ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/package-inputs
      - name: Build the AppImage and source companion
        run: bash tool/build_appimage.sh "$RUNNER_TEMP/flutter.tar.xz" build/appimage-inputs build/appimage-release
      - uses: actions/upload-artifact@v7
        with:
          name: appimage-build
          path: build/appimage-release
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - uses: ./.github/actions/ci-success
        with:
          check: appimage_build

  appimage:
    name: AppImage build and Ubuntu/NixOS acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLLF_VM_ACCELERATOR: kvm
    needs: [changes, appimage-build]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.appimage == 'true' && needs.changes.outputs.appimage_run == '' &&
      (needs.appimage-build.result == 'success' || needs.changes.outputs.appimage_build_run != '')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: appimage-build
          path: build/appimage-release
          run-id: ${{ needs.changes.outputs.appimage_build_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Restore the AppImage executable bit after artifact download
        run: chmod +x build/appimage-release/*.AppImage
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
      - name: Install disposable VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils openssh-client jq iproute2
      - uses: ./.github/actions/ubuntu-image
        id: ubuntu
      - name: Test FUSE, extraction, desktop launch, and the bundled helper
        env:
          IMAGE: ${{ steps.ubuntu.outputs.image }}
          CHECKSUM: ${{ steps.ubuntu.outputs.checksum }}
        run: |
          bash tool/test_portable_distro.sh "$IMAGE" "$CHECKSUM" \
            build/appimage-qualification --appimage build/appimage-release
      - name: Test privileged controls through official NixOS appimage-run
        run: |
          bash tool/test_appimage_nixos.sh build/appimage-release/*.AppImage build/appimage-nixos-qualification
          cp build/appimage-nixos-qualification/appimage-nixos-qualification.tar.gz build/appimage-qualification/
          directory=build/appimage-qualification
          name=appimage-nixos-qualification.tar.gz
          digest="$(sha256sum "$directory/$name" | cut -d ' ' -f1)"
          jq --arg name "$name" --arg digest "$digest" '.files[$name] = $digest' \
            "$directory/manifest.json" >"$directory/manifest.json.tmp"
          mv "$directory/manifest.json.tmp" "$directory/manifest.json"
      - name: Upload AppImage, source, and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appimage-ubuntu-22.04
          overwrite: true
          compression-level: 0
          path: |
            build/appimage-release
            build/appimage-qualification
            build/appimage-nixos-qualification
          if-no-files-found: ignore

      - uses: ./.github/actions/ci-success
        with:
          check: appimage

  linux-integration:
    name: Linux native app integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.integration == 'true' && needs.changes.outputs.integration_run == ''

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build g++ pkg-config libgtk-3-dev libstdc++-12-dev libglib2.0-dev libpolkit-gobject-1-dev gsettings-desktop-schemas xvfb xauth

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run native app integration journey
        shell: bash
        env:
          GSETTINGS_BACKEND: memory
        run: |
          set -o pipefail
          xvfb-run -a --server-args='-screen 0 1280x800x24' \
            bash tool/test_linux_journeys.sh \
            2>&1 | tee linux-integration.log

      - name: Test native portable control argument mapping
        run: |
          flutter build linux --debug --no-pub
          cmake --build build/linux/x64/debug --target portable_control_channel_test
          build/linux/x64/debug/runner/portable_control_channel_test

      - name: Upload integration log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-native-integration-log
          path: linux-integration.log
          if-no-files-found: ignore

      - uses: ./.github/actions/ci-success
        with:
          check: integration

  nix-frontend:
    name: Nix frontend build and acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.nix == 'true' && needs.changes.outputs.nix_run == ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
      - name: Build the frontend, source archive, and metadata check
        run: >-
          nix build .#frontend .#frontend-source
          .#checks.x86_64-linux.nix-metadata --print-build-logs
      - name: Test the installed desktop and helper in a disposable NixOS VM
        run: nix build .#checks.x86_64-linux.frontend-package --print-build-logs

      - uses: ./.github/actions/ci-success
        with:
          check: nix

  debian-build:
    name: Debian build and source companion
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.debian == 'true' && needs.changes.outputs.debian_run == '' && needs.changes.outputs.debian_build_run == ''
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/package-inputs
        with:
          appimage-runtime: 'false'
      - name: Build the Debian package and source companion
        run: bash tool/build_deb.sh "$RUNNER_TEMP/flutter.tar.xz" build/deb-release
      - uses: actions/upload-artifact@v7
        with:
          name: debian-build
          path: build/deb-release
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - uses: ./.github/actions/ci-success
        with:
          check: debian_build

  debian:
    name: Debian package build and acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLLF_VM_ACCELERATOR: kvm
    needs: [changes, debian-build]
    if: >-
      always() && !cancelled() && needs.changes.result == 'success' &&
      needs.changes.outputs.debian == 'true' && needs.changes.outputs.debian_run == '' &&
      (needs.debian-build.result == 'success' || needs.changes.outputs.debian_build_run != '')
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: debian-build
          path: build/deb-release
          run-id: ${{ needs.changes.outputs.debian_build_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install disposable VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils openssh-client jq iproute2
      - name: Enable KVM for acceptance VMs
        run: |
          # Use the persistent KVM rule from cachix/install-nix-action.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm
          test -w /dev/kvm
      - uses: ./.github/actions/ubuntu-image
        id: ubuntu
      - name: Download the verified Debian acceptance image
        run: bash tool/fetch_debian_test_image.sh /tmp/deb-bookworm.img
      - name: Test install, launch, helper, upgrade, and purge on Ubuntu 22.04
        env:
          IMAGE: ${{ steps.ubuntu.outputs.image }}
          CHECKSUM: ${{ steps.ubuntu.outputs.checksum }}
        run: |
          bash tool/test_portable_distro.sh "$IMAGE" "$CHECKSUM" \
            build/deb-ubuntu-qualification --deb build/deb-release
      - name: Test install, launch, helper, upgrade, and purge on Debian 12
        run: |
          checksum="$(cat /tmp/deb-bookworm.img.sha256)"
          bash tool/test_portable_distro.sh /tmp/deb-bookworm.img "$checksum" \
            build/deb-debian-qualification --deb build/deb-release
      - name: Upload the Debian package, sources, and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debian-amd64
          overwrite: true
          compression-level: 0
          path: |
            build/deb-release
            build/deb-ubuntu-qualification
            build/deb-debian-qualification
          if-no-files-found: ignore

      - uses: ./.github/actions/ci-success
        with:
          check: debian
