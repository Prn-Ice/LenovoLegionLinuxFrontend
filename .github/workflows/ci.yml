name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Flutter Test & Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Hive adapters
        run: dart run build_runner build

      - name: Check generated sources
        run: git diff --exit-code -- lib

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter=compact

  native:
    name: Native services and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libglib2.0-dev libpolkit-gobject-1-dev dbus

      - name: Set up Flutter for the portable control probe
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'

      - name: Resolve probe dependencies
        run: flutter pub get --enforce-lockfile

      - name: Configure
        run: >-
          cmake -S telemetry -B build/native -G Ninja
          -DBUILD_LEGION_CONTROL_SERVICE=ON -DBUILD_TESTING=ON
          -DBUILD_PORTABLE_CONTROL_PROTOTYPE=ON

      - name: Build services and tests
        run: >-
          cmake --build build/native --parallel 2 --target
          legion_telemetry_service legion_control_service
          package_power_sampler_test control_commands_test graphics_boot_service_test managed_command_test
          portable_control_probe

      - name: Run native tests
        run: ctest --test-dir build/native --output-on-failure --no-tests=error

      - name: Probe portable control without hardware
        timeout-minutes: 2
        run: dart run tool/probe_portable_control.dart --helper build/native/portable_control_probe

  control-lifecycle:
    name: Control process lifecycle VM
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
      - name: Verify containment with real systemd
        run: nix build .#checks.x86_64-linux.control-lifecycle --print-build-logs

  linux-integration:
    name: Linux native app integration
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build g++ pkg-config libgtk-3-dev libstdc++-12-dev libglib2.0-dev libpolkit-gobject-1-dev gsettings-desktop-schemas xvfb xauth

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run native app integration journey
        shell: bash
        env:
          GSETTINGS_BACKEND: memory
        run: |
          set -o pipefail
          xvfb-run -a --server-args='-screen 0 1280x800x24' \
            bash tool/test_linux_journeys.sh \
            2>&1 | tee linux-integration.log

      - name: Upload integration log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-native-integration-log
          path: linux-integration.log
          if-no-files-found: ignore
