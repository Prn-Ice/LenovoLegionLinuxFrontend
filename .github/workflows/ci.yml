name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  changes:
    name: Select build and VM checks
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.changes.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check PR paths or select every check for main and tags
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            python3 tool/ci_build_changes.py --base "$PR_BASE"
          else
            python3 tool/ci_build_changes.py
          fi

  release-tools:
    name: Release workflow tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Test tag validation and draft release handling
        run: python3 -m unittest discover -s test/tool -p '*_test.py' -v

  test:
    name: Flutter Test & Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Generate Hive adapters
        run: dart run build_runner build

      - name: Check generated sources
        run: git diff --exit-code -- lib

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test --reporter=compact

  native:
    name: Native services and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libglib2.0-dev libpolkit-gobject-1-dev dbus

      - name: Set up Flutter for the portable control probe
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'

      - name: Resolve probe dependencies
        run: flutter pub get --enforce-lockfile

      - name: Configure
        run: >-
          cmake -S telemetry -B build/native -G Ninja
          -DBUILD_LEGION_CONTROL_SERVICE=ON -DBUILD_TESTING=ON
          -DBUILD_PORTABLE_CONTROL_PROTOTYPE=ON -DBUILD_PORTABLE_CONTROL_HELPER=ON

      - name: Build services and tests
        run: >-
          cmake --build build/native --parallel 2 --target
          legion_telemetry_service legion_control_service
          package_power_sampler_test control_commands_test graphics_boot_service_test managed_command_test executable_snapshot_test portable_lifetime_test portable_peer_test trusted_executable_test portable_cli_test
          portable_control_probe legion_portable_control

      - name: Run native tests
        run: ctest --test-dir build/native --output-on-failure --no-tests=error

      - name: Probe portable control without hardware
        timeout-minutes: 2
        run: dart run tool/probe_portable_control.dart --helper build/native/portable_control_probe

  control-lifecycle:
    name: Control lifecycle and portable startup VMs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
      - name: Verify containment and portable startup with real systemd
        run: >-
          nix build .#checks.x86_64-linux.control-lifecycle
          .#checks.x86_64-linux.portable-bootstrap --print-build-logs

  portable-ubuntu:
    name: Portable helper on Ubuntu 22.04
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: changes
    if: needs.changes.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install disposable VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils openssh-client python3
      - name: Download official Ubuntu cloud image and checksum
        run: |
          curl --fail --location --retry 3 --max-time 600 \
            https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img -o /tmp/jammy.img
          curl --fail --location --retry 3 --max-time 60 \
            https://cloud-images.ubuntu.com/jammy/current/SHA256SUMS -o /tmp/jammy.SHA256SUMS
      - name: Build and qualify against distro libraries in the VM
        run: |
          checksum="$(awk '$2 == "*jammy-server-cloudimg-amd64.img" {print $1}' /tmp/jammy.SHA256SUMS)"
          bash tool/test_portable_distro.sh /tmp/jammy.img "$checksum" build/ubuntu-qualification
      - name: Upload qualification results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: portable-ubuntu-22.04-qualification
          path: build/ubuntu-qualification
          if-no-files-found: ignore

  appimage:
    name: AppImage build and Ubuntu/NixOS acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install disposable VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils openssh-client python3
      - name: Download pinned build inputs
        run: |
          sdk_url="$(python3 -c 'import json; print(json.load(open("packaging/appimage/build-inputs.json"))["flutter"]["url"])')"
          curl --fail --silent --show-error --location --retry 3 --max-time 900 "$sdk_url" -o /tmp/flutter.tar.xz
          python3 tool/fetch_appimage_runtime.py build/appimage-inputs
      - name: Build the AppImage and source companion
        run: bash tool/build_appimage.sh /tmp/flutter.tar.xz build/appimage-inputs build/appimage-release
      - name: Download official acceptance VM
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 600 \
            https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img -o /tmp/appimage-jammy.img
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            https://cloud-images.ubuntu.com/jammy/current/SHA256SUMS -o /tmp/appimage-jammy.SHA256SUMS
      - name: Test FUSE, extraction, desktop launch, and the bundled helper
        run: |
          checksum="$(awk '$2 == "*jammy-server-cloudimg-amd64.img" {print $1}' /tmp/appimage-jammy.SHA256SUMS)"
          bash tool/test_portable_distro.sh /tmp/appimage-jammy.img "$checksum" \
            build/appimage-qualification --appimage build/appimage-release
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
      - name: Test temporary controls through official NixOS appimage-run
        run: |
          bash tool/test_appimage_nixos.sh build/appimage-release/*.AppImage build/appimage-nixos-qualification
          cp build/appimage-nixos-qualification/appimage-nixos-qualification.tar.gz build/appimage-qualification/
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          directory = Path('build/appimage-qualification')
          manifest = json.loads((directory / 'manifest.json').read_text())
          name = 'appimage-nixos-qualification.tar.gz'
          manifest['files'][name] = hashlib.sha256((directory / name).read_bytes()).hexdigest()
          (directory / 'manifest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Upload AppImage, source, and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appimage-ubuntu-22.04
          path: |
            build/appimage-release
            build/appimage-qualification
          if-no-files-found: ignore

  linux-integration:
    name: Linux native app integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.build == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build g++ pkg-config libgtk-3-dev libstdc++-12-dev libglib2.0-dev libpolkit-gobject-1-dev gsettings-desktop-schemas xvfb xauth

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run native app integration journey
        shell: bash
        env:
          GSETTINGS_BACKEND: memory
        run: |
          set -o pipefail
          xvfb-run -a --server-args='-screen 0 1280x800x24' \
            bash tool/test_linux_journeys.sh \
            2>&1 | tee linux-integration.log

      - name: Test native portable control argument mapping
        run: |
          flutter build linux --debug --no-pub
          cmake --build build/linux/x64/debug --target portable_control_channel_test
          build/linux/x64/debug/runner/portable_control_channel_test

      - name: Upload integration log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-native-integration-log
          path: linux-integration.log
          if-no-files-found: ignore

  nix-frontend:
    name: Nix frontend build and acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
      - name: Build the frontend, source archive, and metadata check
        run: >-
          nix build .#frontend .#frontend-source
          .#checks.x86_64-linux.nix-metadata --print-build-logs
      - name: Test the installed desktop and helper in a disposable NixOS VM
        run: nix build .#checks.x86_64-linux.frontend-package --print-build-logs

  debian:
    name: Debian package build and acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.build == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install disposable VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils openssh-client python3
      - name: Download the pinned SDK
        run: |
          sdk_url="$(python3 -c 'import json; print(json.load(open("packaging/appimage/build-inputs.json"))["flutter"]["url"])')"
          curl --fail --silent --show-error --location --retry 3 --max-time 900 "$sdk_url" -o /tmp/flutter.tar.xz
      - name: Build the Debian package and source companion
        run: bash tool/build_deb.sh /tmp/flutter.tar.xz build/deb-release
      - name: Download verified Ubuntu and Debian acceptance images
        run: |
          curl --fail --silent --show-error --location --retry 3 --max-time 600 \
            https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img -o /tmp/deb-jammy.img
          curl --fail --silent --show-error --location --retry 3 --max-time 60 \
            https://cloud-images.ubuntu.com/jammy/current/SHA256SUMS -o /tmp/deb-jammy.SHA256SUMS
          bash tool/fetch_debian_test_image.sh /tmp/deb-bookworm.img
      - name: Test install, launch, helper, upgrade, and purge on Ubuntu 22.04
        run: |
          checksum="$(awk '$2 == "*jammy-server-cloudimg-amd64.img" {print $1}' /tmp/deb-jammy.SHA256SUMS)"
          bash tool/test_portable_distro.sh /tmp/deb-jammy.img "$checksum" \
            build/deb-ubuntu-qualification --deb build/deb-release
      - name: Test install, launch, helper, upgrade, and purge on Debian 12
        run: |
          checksum="$(cat /tmp/deb-bookworm.img.sha256)"
          bash tool/test_portable_distro.sh /tmp/deb-bookworm.img "$checksum" \
            build/deb-debian-qualification --deb build/deb-release
      - name: Upload the Debian package, sources, and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debian-amd64
          path: |
            build/deb-release
            build/deb-ubuntu-qualification
            build/deb-debian-qualification
          if-no-files-found: ignore
