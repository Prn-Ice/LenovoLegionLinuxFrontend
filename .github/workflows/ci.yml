name: Release validation

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    name: Select build and VM checks
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    outputs:
      integration: ${{ steps.changes.outputs.integration }}
      lifecycle: ${{ steps.changes.outputs.lifecycle }}
      nix: ${{ steps.changes.outputs.nix }}
      appimage: ${{ steps.changes.outputs.appimage }}
      debian: ${{ steps.changes.outputs.debian }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check PR paths or select every check for releases
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            bash tool/ci/ci_build_changes.sh --base "$PR_BASE"
          else
            bash tool/ci/ci_build_changes.sh
          fi

  test:
    name: Flutter Test & Analyze
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Load the local Flutter SDK
        if: runner.environment == 'self-hosted'
        run: |
          version="$(jq -er '.flutter.version' packaging/appimage/build-inputs.json)"
          digest="$(jq -er '.flutter.sha256' packaging/appimage/build-inputs.json)"
          sdk="$RUNNER_TOOL_CACHE/flutter/stable-$version-x64"
          if [[ ! -x "$sdk/flutter/bin/flutter" ]]; then
            archive="$(bash tool/ci/cache_flutter_archive.sh "$HOME/.cache/legion-ci/flutter-$digest.tar.xz")"
            mkdir -p "$sdk"
            staging="$(mktemp -d "$sdk/.extract.XXXXXXXX")"
            trap 'rm -rf "$staging"' EXIT
            tar -xf "$archive" -C "$staging"
            mv "$staging/flutter" "$sdk/flutter"
          fi
          echo "$sdk/flutter/bin" >> "$GITHUB_PATH"
          echo "FLUTTER_ROOT=$sdk/flutter" >> "$GITHUB_ENV"
      - name: Set up Flutter
        if: runner.environment == 'github-hosted'
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Install dependencies
        run: |
          packages=(cmake g++ make dpkg squashfs-tools git openssh-client)
          if ! dpkg-query -W -f='${db:Status-Status}\n' "${packages[@]}" > "$RUNNER_TEMP/package-status" 2>/dev/null ||
              grep -qvx installed "$RUNNER_TEMP/package-status"; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
          fi
          flutter pub get --enforce-lockfile

      - name: Generate Hive adapters
        run: dart run build_runner build

      - name: Check generated sources
        run: git diff --exit-code -- lib

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        env:
          LOCAL_RUNNER: ${{ runner.environment == 'self-hosted' }}
        run: |
          # Two Flutter workers exceeded the local machine's 4 GiB limit.
          workers=()
          if [[ $LOCAL_RUNNER == true ]]; then workers=(--concurrency=1); fi
          flutter test --reporter=expanded "${workers[@]}"

      - name: Test VM readiness and evidence handling
        run: |
          bash control/test/acceptance_support_test.sh
          bash test/tool/appimage_nixos_wrapper_test.sh
          bash test/tool/distro_evidence_test.sh
          bash test/tool/distro_readiness_test.sh

  native:
    name: Native services and tests
    # These checks need pidfds and execution from sealed file descriptors,
    # which fail under the temporary runner's Rosetta translation.
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libglib2.0-dev dbus jq

      - name: Test graphics guards without hardware
        run: |
          bash tool/diagnostics/test_check_graphics_tty.sh
          bash tool/diagnostics/test_auto_battery_tty_json.sh

      - name: Set up Flutter for the hardware control probe
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Resolve probe dependencies
        run: flutter pub get --enforce-lockfile

      - name: Configure
        run: >-
          cmake -S control -B build/native -G Ninja
          -DBUILD_TESTING=ON
          -DBUILD_CONTROL_PROTOTYPE=ON -DBUILD_CONTROL_HELPER=ON

      - name: Build services and tests
        run: >-
          cmake --build build/native --parallel 2 --target
          package_power_sampler_test control_commands_test managed_command_test executable_snapshot_test helper_lifetime_test control_peer_test trusted_executable_test helper_cli_test
          control_probe legion_control_helper

      - name: Run native tests
        run: ctest --test-dir build/native --output-on-failure --no-tests=error

      - name: Probe hardware control without hardware
        timeout-minutes: 2
        run: dart run tool/diagnostics/probe_control.dart --helper build/native/control_probe

  control-lifecycle:
    name: Control lifecycle and helper startup VMs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.lifecycle == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
      - name: Verify containment and helper startup with real systemd
        run: >-
          nix build .#checks.x86_64-linux.helper-bootstrap --print-build-logs

  appimage-build:
    name: AppImage build and source companion
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.appimage == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/package-inputs
      - name: Build the AppImage and source companion
        run: bash tool/packaging/build_appimage.sh "$PACKAGE_FLUTTER_ARCHIVE" "$PACKAGE_RUNTIME_INPUTS" build/appimage-release
      - uses: actions/upload-artifact@v7
        with:
          name: appimage-build
          path: build/appimage-release
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  appimage:
    name: AppImage build and Ubuntu/NixOS acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLLF_VM_ACCELERATOR: kvm
    needs: appimage-build
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: appimage-build
          path: build/appimage-release
      - name: Restore the AppImage executable bit after artifact download
        run: chmod +x build/appimage-release/*.AppImage
      - name: Install Dart to record package test results
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.14.0'
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
      - name: Install disposable VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils openssh-client jq iproute2
      - uses: ./.github/actions/ubuntu-image
        id: ubuntu
      - name: Test FUSE, extraction, desktop launch, and the bundled helper
        env:
          IMAGE: ${{ steps.ubuntu.outputs.image }}
          CHECKSUM: ${{ steps.ubuntu.outputs.checksum }}
        run: |
          bash tool/ci/test_distro.sh "$IMAGE" "$CHECKSUM" \
            build/appimage-qualification --appimage build/appimage-release
      - name: Test privileged controls through official NixOS appimage-run
        run: |
          bash tool/ci/test_appimage_nixos.sh build/appimage-release/*.AppImage build/appimage-nixos-qualification
          cp build/appimage-nixos-qualification/appimage-nixos-qualification.tar.gz build/appimage-qualification/
          dart tool/ci/record_package_test_results.dart nixos build/appimage-qualification
      - name: Upload AppImage, source, and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: appimage-ubuntu-22.04
          overwrite: true
          compression-level: 0
          path: |
            build/appimage-release
            build/appimage-qualification
            build/appimage-nixos-qualification
          if-no-files-found: ignore

  linux-integration:
    name: Linux native app integration
    # Run the desktop journey on native Linux; translated execution failed
    # during Flutter/Xvfb cleanup after the test cases.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.integration == 'true'

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build g++ pkg-config libgtk-3-dev libstdc++-12-dev libglib2.0-dev gsettings-desktop-schemas xvfb xauth

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Install Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run native app integration journey
        shell: bash
        env:
          GSETTINGS_BACKEND: memory
        run: |
          set -o pipefail
          xvfb-run -a --server-args='-screen 0 1280x800x24' \
            bash tool/ci/test_linux_journeys.sh \
            2>&1 | tee linux-integration.log

      - name: Test native hardware control argument mapping
        run: |
          flutter build linux --debug --no-pub
          cmake --build build/linux/x64/debug --target control_channel_test
          xvfb-run -a build/linux/x64/debug/runner/control_channel_test

      - name: Upload integration log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: linux-native-integration-log
          path: linux-integration.log
          if-no-files-found: ignore

  nix-frontend:
    name: Nix frontend build and acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
        with:
          enable_kvm: true
      - name: Build the frontend and sources; check metadata and release tagging
        run: >-
          nix build .#frontend .#frontend-source
          .#checks.x86_64-linux.nix-metadata
          .#checks.x86_64-linux.appimage-package
          .#checks.x86_64-linux.release-tag --print-build-logs
      - name: Test the installed desktop and helper in a disposable NixOS VM
        run: nix build .#checks.x86_64-linux.frontend-package --print-build-logs

  debian-build:
    name: Debian build and source companion
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 45
    needs: changes
    if: needs.changes.outputs.debian == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/package-inputs
        with:
          appimage-runtime: 'false'
      - name: Build the Debian package and source companion
        run: bash tool/packaging/build_deb.sh "$PACKAGE_FLUTTER_ARCHIVE" build/deb-release
      - uses: actions/upload-artifact@v7
        with:
          name: debian-build
          path: build/deb-release
          compression-level: 0
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  debian:
    name: Debian package build and acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      LLLF_VM_ACCELERATOR: kvm
    needs: debian-build
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: debian-build
          path: build/deb-release
      - name: Install Dart to record package test results
        uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.14.0'
      - name: Install disposable VM tools
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils openssh-client jq iproute2
      - name: Enable KVM for acceptance VMs
        run: |
          # Use the persistent KVM rule from cachix/install-nix-action.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo udevadm settle
          test -r /dev/kvm
          test -w /dev/kvm
      - uses: ./.github/actions/ubuntu-image
        id: ubuntu
      - name: Download the verified Debian acceptance image
        run: bash tool/ci/fetch_debian_test_image.sh /tmp/deb-bookworm.img
      - name: Test install, launch, helper, upgrade, and purge on Ubuntu 22.04
        env:
          IMAGE: ${{ steps.ubuntu.outputs.image }}
          CHECKSUM: ${{ steps.ubuntu.outputs.checksum }}
        run: |
          bash tool/ci/test_distro.sh "$IMAGE" "$CHECKSUM" \
            build/deb-ubuntu-qualification --deb build/deb-release
      - name: Test install, launch, helper, upgrade, and purge on Debian 12
        run: |
          checksum="$(cat /tmp/deb-bookworm.img.sha256)"
          bash tool/ci/test_distro.sh /tmp/deb-bookworm.img "$checksum" \
            build/deb-debian-qualification --deb build/deb-release
      - name: Upload the Debian package, sources, and acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: debian-amd64
          overwrite: true
          compression-level: 0
          path: |
            build/deb-release
            build/deb-ubuntu-qualification
            build/deb-debian-qualification
          if-no-files-found: ignore
