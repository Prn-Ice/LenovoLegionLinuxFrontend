name: Tagged release

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check release tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
      ci_run: ${{ steps.ci.outputs.ci_run }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
          pub-cache: false
      - name: Match the tag to pubspec.yaml and the checked-out commit
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: dart tool/release_workflow.dart check-tag "$RELEASE_TAG"
      - name: Find completed main CI for the tagged commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: dart tool/find_release_ci.dart

  checks:
    name: Release checks and artifacts
    needs: version
    if: needs.version.outputs.ci_run == ''
    uses: ./.github/workflows/ci.yml

  draft:
    name: Prepare GitHub release draft
    needs: [version, checks]
    if: >-
      always() && !cancelled() && needs.version.result == 'success' &&
      (needs.checks.result == 'success' ||
       (needs.checks.result == 'skipped' && needs.version.outputs.ci_run != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.version.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'
          cache: true
          pub-cache: false
      - name: Download the checked AppImage and acceptance evidence
        uses: actions/download-artifact@v8
        with:
          name: appimage-ubuntu-22.04
          path: build/release-inputs
          run-id: ${{ needs.version.outputs.ci_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Download the checked Debian package and both VM results
        uses: actions/download-artifact@v8
        with:
          name: debian-amd64
          path: build/release-inputs
          run-id: ${{ needs.version.outputs.ci_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install the AppImage inspection tool
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools
      - name: Validate the source, artifact, and VM evidence together
        env:
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: >-
          dart tool/release_workflow.dart prepare "$RELEASE_TAG"
          build/release-inputs build/tag-release
      - name: Create or refresh the draft and upload its assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: dart tool/release_workflow.dart publish "$RELEASE_TAG" build/tag-release
