# Run flutter analyze to check Dart errors, warnings, and Flutter lints.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
include: package:flutter_lints/flutter.yaml

linter:
  # Add project-specific overrides here. Rule reference: https://dart.dev/lints.
  rules:
