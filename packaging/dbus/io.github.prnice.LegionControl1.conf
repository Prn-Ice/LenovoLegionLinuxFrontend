<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <allow send_destination="io.github.prnice.LegionControl1"
           send_interface="io.github.prnice.LegionControl1"/>
  </policy>
  <policy user="root">
    <allow own="io.github.prnice.LegionControl1"/>
    <allow send_destination="io.github.prnice.LegionControl1"/>
  </policy>
</busconfig>
