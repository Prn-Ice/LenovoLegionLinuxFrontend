<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny send_destination="io.github.prnice.LegionTelemetry1"/>
  </policy>

  <policy group="legion-telemetry">
    <allow send_destination="io.github.prnice.LegionTelemetry1"
           send_interface="io.github.prnice.LegionTelemetry1"
           send_member="GetSnapshot"/>
  </policy>

  <policy user="root">
    <allow own="io.github.prnice.LegionTelemetry1"/>
    <allow send_destination="io.github.prnice.LegionTelemetry1"/>
  </policy>
</busconfig>
